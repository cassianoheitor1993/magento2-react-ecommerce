##
# Magento 2 Open Source - Docker Development Environment
# Usage: docker compose up -d
##

services:
  # --- Web Server + PHP ---
  web:
    image: markoshust/magento-nginx:1.24-0
    ports:
      - "8080:8000"
      - "8443:8443"
    volumes:
      - ./magento2:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - fpm-sock:/sock
    depends_on:
      - phpfpm
    networks:
      - magento

  phpfpm:
    image: markoshust/magento-php:8.3-fpm-2
    volumes:
      - ./magento2:/var/www/html
      - fpm-sock:/sock
      - ./php-fpm/zz-custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    depends_on:
      - db
      - opensearch
      - redis
      - rabbitmq
    networks:
      - magento

  # --- Database ---
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: magento
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - magento

  # --- Search Engine ---
  opensearch:
    image: markoshust/magento-opensearch:2.12-0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - magento

  # --- Cache ---
  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    networks:
      - magento

  # --- Message Queue ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"  # Management UI
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento
    networks:
      - magento

  # --- Email Testing ---
  mailcatcher:
    image: sj26/mailcatcher
    ports:
      - "1080:1080"  # Web UI for testing emails
    networks:
      - magento

volumes:
  db-data:
  opensearch-data:
  fpm-sock:

networks:
  magento:
    driver: bridge
